name: maizeguard_flutter
description: A premium AI-powered Maize disease diagnostic app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.0.5
  image_picker: ^1.0.4
  camera: ^0.10.5+5
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  intl: ^0.18.1
  geolocator: ^10.1.0
  shared_preferences: ^2.2.1
  path_provider: ^2.1.1
  path: ^1.8.3
  cached_network_image: ^3.3.0
  flutter_staggered_animations: ^1.1.1
  glassmorphism_ui: ^0.3.0
  google_generative_ai: ^0.2.0
  sqflite: ^2.3.0
  weather: any
  flutter_markdown: ^0.6.18+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
